[options]
admin_passwd = admin
db_host = False
db_port = False
db_user = odoo
db_password = False
db_name = TurnkeylinuxExample

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/custom-addons

proxy_mode = True
list_db = True

